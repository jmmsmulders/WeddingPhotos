<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding Gallery</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell shell-wide">
      <header class="gallery-head">
        <div>
          <p class="kicker" data-i18n="kicker">Live gallery</p>
          <h1 data-i18n="title">Joep &amp; Juliana's Wedding</h1>
        </div>
        <div class="gallery-actions">
          <div class="segmented" aria-label="Gallery view size" data-i18n-aria-label="viewSize">
            <button id="largeView" type="button" aria-pressed="true" data-i18n="largeView">Large</button>
            <button id="compactView" type="button" aria-pressed="false" data-i18n="compactView">Gallery</button>
          </div>
          <a class="ghost-link" href="/" data-i18n="upload">Upload</a>
        </div>
      </header>
      <div id="gallery" class="gallery" aria-live="polite"></div>
      <p id="galleryStatus" class="status" data-i18n="loading">Loading the latest uploads...</p>
    </main>
    <script src="/gallery.js" type="module"></script>
  </body>
</html>
